<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background Whiteboard Canvas -->
  <rect width="1200" height="675" fill="#ffffff"/>

  <!-- Top Classroom Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <rect x="30" y="18" width="34" height="34" rx="8" fill="#f1f5f9"/>
  <text x="47" y="41" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#64748b" text-anchor="middle">‹</text>

  <rect x="80" y="18" width="34" height="34" rx="8" fill="url(#primary)"/>
  <text x="97" y="41" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">✏️</text>

  <text x="130" y="33" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#0f172a">Electromagnetic Induction</text>
  <text x="130" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Physics • XII-A • Mr. Sharma</text>

  <!-- Live Badge -->
  <rect x="880" y="20" width="90" height="30" rx="15" fill="#ecfdf5"/>
  <circle cx="896" cy="35" r="4" fill="#10b981"/>
  <text x="910" y="39" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#10b981">● LIVE</text>

  <!-- End Class Button -->
  <rect x="990" y="18" width="180" height="34" rx="10" fill="#dc2626"/>
  <text x="1080" y="40" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">END CLASS</text>

  <!-- Whiteboard Drawing Content -->
  <g transform="translate(150, 120)">
    <path d="M 50 150 Q 200 50 350 200 T 650 150 T 850 250" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <path d="M 100 250 Q 300 150 500 280 T 800 200" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="8,8" stroke-linecap="round"/>
    <text x="60" y="100" font-family="monospace" font-weight="bold" font-size="28" fill="#1e293b">ℰ = - dΦ_B / dt</text>
    <text x="60" y="340" font-family="monospace" font-size="20" fill="#475569">Magnetic Flux Φ_B = ∫ B · dA</text>
  </g>

  <!-- Floating Whiteboard Toolbar at Bottom -->
  <g transform="translate(360, 580)">
    <rect width="480" height="64" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="drop-shadow(0 20px 25px -5px rgb(0 0 / 0.1))"/>
    
    <!-- Tools -->
    <rect x="12" y="10" width="44" height="44" rx="12" fill="#4f46e5"/>
    <text x="34" y="37" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🖊️</text>

    <rect x="64" y="10" width="44" height="44" rx="12" fill="#f8fafc"/>
    <text x="86" y="37" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🖍️</text>

    <rect x="116" y="10" width="44" height="44" rx="12" fill="#f8fafc"/>
    <text x="138" y="37" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🧹</text>

    <rect x="168" y="10" width="44" height="44" rx="12" fill="#f8fafc"/>
    <text x="190" y="37" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🔤</text>

    <!-- Colors -->
    <line x1="230" y1="16" x2="230" y2="48" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="255" cy="32" r="10" fill="#0f172a"/>
    <circle cx="285" cy="32" r="10" fill="#ef4444"/>
    <circle cx="315" cy="32" r="10" fill="#3b82f6"/>
    <circle cx="345" cy="32" r="10" fill="#10b981"/>

    <!-- Clear / Trash -->
    <line x1="375" y1="16" x2="375" y2="48" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="400" y="10" width="68" height="44" rx="12" fill="#fef2f2"/>
    <text x="434" y="37" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🗑️</text>
  </g>
</svg>
