<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>

  <!-- Top Navigation -->
  <rect x="0" y="0" width="1200" height="70" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" cy="35" r="16" fill="url(#primary)"/>
  <text x="50" y="40" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">CS</text>
  <text x="80" y="42" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#0f172a">Classroom Sync</text>

  <!-- Student Badge -->
  <rect x="1000" y="18" width="150" height="34" rx="17" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="1022" cy="35" r="12" fill="#c7d2fe"/>
  <text x="1022" y="39" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#4f46e5" text-anchor="middle">T</text>
  <text x="1045" y="37" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#334155">Tirtharaj</text>

  <!-- Main Content -->
  <text x="80" y="125" font-family="system-ui, sans-serif" font-weight="bold" font-size="28" fill="#0f172a">Good morning, Tirtharaj</text>
  <text x="80" y="150" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Ready to catch up on your studies?</text>

  <!-- Live Now Section -->
  <text x="80" y="200" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#0f172a">Live Now</text>
  <circle cx="168" cy="194" r="5" fill="#ef4444"/>

  <!-- Live Class Card -->
  <g transform="translate(80, 220)">
    <rect width="720" height="130" rx="20" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="drop-shadow(0 10px 15px -3px rgb(79 70 229 / 0.1))"/>
    
    <rect x="24" y="24" width="82" height="82" rx="16" fill="#e0e7ff"/>
    <text x="65" y="73" font-family="system-ui, sans-serif" font-size="32" text-anchor="middle">▶️</text>

    <rect x="126" y="26" width="75" height="24" rx="6" fill="#e0e7ff"/>
    <text x="163" y="42" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#4f46e5" text-anchor="middle">PHYSICS</text>
    <text x="215" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">• XII-A</text>

    <text x="126" y="72" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#0f172a">Electromagnetic Induction</text>
    <text x="126" y="96" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Teacher: <tspan font-weight="600" fill="#334155">Mr. Sharma</tspan></text>

    <!-- Join Button -->
    <rect x="520" y="38" width="170" height="54" rx="14" fill="url(#primary)"/>
    <text x="605" y="71" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">JOIN CLASS →</text>
  </g>

  <!-- Recent Classes Section -->
  <text x="80" y="400" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#0f172a">Recent Sessions</text>

  <!-- Recent Card 1 -->
  <g transform="translate(80, 430)">
    <rect width="345" height="180" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="24" y="24" width="36" height="36" rx="10" fill="#f1f5f9"/>
    <text x="42" y="47" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">📁</text>
    <text x="290" y="48" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#94a3b8">XII-A</text>

    <text x="24" y="90" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#0f172a">Solutions & Colligative Prop.</text>
    <text x="24" y="112" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#4f46e5">Chemistry</text>

    <line x1="24" y1="135" x2="321" y2="135" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="157" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">📅 Sep 29, 2026</text>
    <text x="280" y="157" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">50 min</text>
  </g>

  <!-- Recent Card 2 -->
  <g transform="translate(455, 430)">
    <rect width="345" height="180" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="24" y="24" width="36" height="36" rx="10" fill="#f1f5f9"/>
    <text x="42" y="47" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">📁</text>
    <text x="290" y="48" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#94a3b8">XII-A</text>

    <text x="24" y="90" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#0f172a">Definite Integrals & Area</text>
    <text x="24" y="112" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#4f46e5">Mathematics</text>

    <line x1="24" y1="135" x2="321" y2="135" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="157" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">📅 Sep 28, 2026</text>
    <text x="280" y="157" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">45 min</text>
  </g>

  <!-- Right Sidebar Banner -->
  <g transform="translate(835, 220)">
    <rect width="285" height="390" rx="20" fill="#4f46e5"/>
    <text x="32" y="48" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#ffffff">Sync up with your classmates</text>
    <text x="32" y="90" font-family="system-ui, sans-serif" font-size="14" fill="#e0e7ff" width="220">
      <tspan x="32" dy="0">Missed a note during Physics?</tspan>
      <tspan x="32" dy="22">Don't worry, Classroom Sync</tspan>
      <tspan x="32" dy="22">has it archived exactly as it</tspan>
      <tspan x="32" dy="22">appeared on the board.</tspan>
    </text>

    <rect x="32" y="295" width="221" height="48" rx="12" fill="#ffffff" fill-opacity="0.15"/>
    <text x="142" y="325" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">Learn how it works</text>
  </g>
</svg>
