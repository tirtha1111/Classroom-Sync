<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Top Navigation -->
  <rect x="0" y="0" width="1200" height="70" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" cy="35" r="18" fill="url(#primary)"/>
  <text x="50" y="41" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">CS</text>
  <text x="85" y="42" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#0f172a">Classroom Sync</text>
  
  <text x="450" y="42" font-family="system-ui, sans-serif" font-size="14" fill="#475569">Features</text>
  <text x="530" y="42" font-family="system-ui, sans-serif" font-size="14" fill="#475569">How it Works</text>

  <rect x="970" y="18" width="90" height="34" rx="8" fill="#f1f5f9"/>
  <text x="1015" y="40" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#334155" text-anchor="middle">Sign In</text>

  <rect x="1075" y="18" width="95" height="34" rx="8" fill="url(#primary)"/>
  <text x="1122" y="40" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle">Get Started</text>

  <!-- Hero Content -->
  <text x="80" y="180" font-family="system-ui, sans-serif" font-weight="800" font-size="48" fill="#0f172a">Never miss what happened</text>
  <text x="80" y="240" font-family="system-ui, sans-serif" font-weight="800" font-size="48" fill="#4f46e5">in class.</text>
  
  <text x="80" y="295" font-family="system-ui, sans-serif" font-size="18" fill="#475569">Live classroom work, saved automatically so students can catch up anytime.</text>
  <text x="80" y="325" font-family="system-ui, sans-serif" font-size="18" fill="#475569">The digital whiteboard that connects teachers and students instantly.</text>

  <!-- CTA Buttons -->
  <rect x="80" y="375" width="230" height="56" rx="14" fill="url(#primary)"/>
  <text x="195" y="410" font-family="system-ui, sans-serif" font-weight="bold" font-size="15" fill="#ffffff" text-anchor="middle">Continue as Student</text>

  <rect x="330" y="375" width="230" height="56" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="445" y="410" font-family="system-ui, sans-serif" font-weight="bold" font-size="15" fill="#0f172a" text-anchor="middle">Continue as Teacher</text>

  <!-- Right Hero Card / Preview -->
  <g transform="translate(620, 140)">
    <rect width="500" height="420" rx="24" fill="#1e293b" shadow="0 25px 50px -12px rgba(0,0,0,0.25)"/>
    
    <!-- Live Badge -->
    <rect x="30" y="30" width="160" height="32" rx="16" fill="#ef4444" fill-opacity="0.2"/>
    <circle cx="48" cy="46" r="5" fill="#ef4444"/>
    <text x="62" y="51" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ef4444">LIVE: PHYSICS XII-A</text>

    <!-- Whiteboard mockup inside card -->
    <rect x="30" y="80" width="440" height="230" rx="12" fill="#ffffff"/>
    <path d="M 60 180 Q 140 100 220 180 T 380 160" fill="none" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
    <text x="70" y="130" font-family="monospace" font-size="16" fill="#64748b">E = mc²</text>
    <text x="70" y="240" font-family="monospace" font-size="14" fill="#64748b">F = ma</text>

    <!-- Teacher Footer in Card -->
    <rect x="30" y="330" width="440" height="60" rx="12" fill="#0f172a"/>
    <circle cx="60" cy="360" r="16" fill="#4f46e5"/>
    <text x="60" y="365" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">MS</text>
    <text x="90" y="355" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">Mr. Sharma</text>
    <text x="90" y="373" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Electromagnetic Induction</text>
  </g>
</svg>
